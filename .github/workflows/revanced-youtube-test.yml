name: ReVanced YouTube test build

on:
  push:
    branches:
      - "feature/mobile-revanced-youtube-from-1.10.25"
    paths:
      - ".github/workflows/revanced-youtube-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          packages: "build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Download ReVanced CLI 6.0.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar
          test -s revanced-cli.jar

      - name: Download official ReVanced patch bundle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://api.revanced.app/v5/patches.rvp \
            -o patches.rvp
          test -s patches.rvp
          unzip -t patches.rvp >/dev/null
          sha256sum patches.rvp

      - name: Download compatible YouTube 20.40.45 APK from APKMirror
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -A "Mozilla/5.0" \
            "https://www.apkmirror.com/apk/google-inc/youtube/youtube-20-40-45-release/youtube-20-40-45-2-android-apk-download/download/?forcebaseapk=true&key=bd89e7c340faa5556eca2021544fe01ccc817296" \
            -o youtube-20.40.45.apk
          test -s youtube-20.40.45.apk
          echo "b7659da492a1ebd8bd7cea2909be4ee1f58e00a2586d65a1c91b2e1e5ec6acd1  youtube-20.40.45.apk" | sha256sum -c -
          echo "https://www.apkmirror.com/apk/google-inc/youtube/youtube-20-40-45-release/youtube-20-40-45-2-android-apk-download/" > apk-download-url.txt

      - name: Verify YouTube package
        run: |
          set -euo pipefail
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging youtube-20.40.45.apk | head -n 3

      - name: List compatible patches
        run: |
          set -euo pipefail
          java -jar revanced-cli.jar list-patches --packages --versions -bp patches.rvp > patches-list.txt
          grep -i -A12 -B3 'GmsCore support' patches-list.txt || true
          grep -i -A12 -B3 'Spoof video streams' patches-list.txt || true
          grep -i -A20 -B3 'com.google.android.youtube' patches-list.txt | head -n 120 || true

      - name: Patch YouTube 20.40.45
        run: |
          set -euo pipefail
          java -jar revanced-cli.jar patch \
            -p patches.rvp \
            -e "GmsCore support" \
            -e "Spoof video streams" \
            --purge \
            -o youtube-20.40.45-revanced.apk \
            youtube-20.40.45.apk

      - name: Verify patched APK
        run: |
          set -euo pipefail
          test -s youtube-20.40.45-revanced.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose youtube-20.40.45-revanced.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging youtube-20.40.45-revanced.apk | head -n 3
          sha256sum youtube-20.40.45-revanced.apk

      - name: Upload patched YouTube APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NM7-ReVanced-YouTube-21.37.42-test
          path: |
            youtube-20.40.45-revanced.apk
            patches-list.txt
            apk-download-url.txt
          retention-days: 30
