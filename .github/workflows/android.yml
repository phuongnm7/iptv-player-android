name: Build private Android APK

on:
  push:
    branches: [main, "fix/mobile-*", "feature/mobile-*"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: iptv-private-android-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare embedded ReVanced patch bundle
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/revanced
          curl --fail --location --retry 3 --retry-delay 2 \
            https://api.revanced.app/v5/patches.rvp \
            --output app/src/main/assets/revanced/patches.rvp
          test -s app/src/main/assets/revanced/patches.rvp
          unzip -t app/src/main/assets/revanced/patches.rvp >/dev/null
          sha256sum app/src/main/assets/revanced/patches.rvp | tee app/src/main/assets/revanced/patches.rvp.sha256
      - name: Prepare embedded YouTube ReVanced 20.40.45
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar
          curl --fail --location --retry 3 -A "Mozilla/5.0" \
            "https://drive.usercontent.google.com/download?id=1JwOfraPKaOKvDfdhuWwNkf2REL7D6Ngz&export=download&confirm=t" \
            -o youtube-20.40.45.apk
          test -s youtube-20.40.45.apk
          java -jar revanced-cli.jar patch \
            -p app/src/main/assets/revanced/patches.rvp \
            -b \
            -e "GmsCore support" \
            -e "Spoof video streams" \
            --purge \
            -o youtube-20.40.45-revanced.apk \
            youtube-20.40.45.apk
          test -s youtube-20.40.45-revanced.apk
          mkdir -p app/src/main/assets/revanced
          cp youtube-20.40.45-revanced.apk app/src/main/assets/revanced/youtube-20.40.45-revanced.apk
          sha256sum app/src/main/assets/revanced/youtube-20.40.45-revanced.apk

      - name: Compile, test and lint Mobile
        run: gradle --no-daemon --console=plain testMobileDebugUnitTest lintMobileDebug assembleMobileDebug
      - name: Read Mobile version
        id: mobile_version
        run: |
          version="$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify and package Mobile APK
        run: |
          mkdir -p dist/mobile
          apk="dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          if unzip -l "$apk" | grep -q 'libvlc\\.so'; then
            echo 'Mobile APK unexpectedly contains LibVLC' >&2
            exit 1
          fi
          (cd dist/mobile && sha256sum "NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk" | tee SHA256SUMS.txt)
      - name: Upload Mobile APK
        id: upload_mobile_apk
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}-APK
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Smoke-test Mobile APK on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 420
          disable-animations: true
          disable-spellchecker: true
          script: python3 tools/android_smoke_current.py dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk
      - name: Publish Mobile test APK when artifact storage is unavailable
        if: steps.upload_mobile_apk.outcome == 'failure' && startsWith(github.ref_name, 'fix/mobile-')
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ steps.mobile_version.outputs.version }}
        run: |
          tag="mobile-v${MOBILE_VERSION}-test"
          title="NM7 IPTV Mobile ${MOBILE_VERSION} (test)"
          notes="Automated test build from ${GITHUB_SHA}. Main remains on the last confirmed stable version."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/mobile/* --clobber
          else
            gh release create "$tag" dist/mobile/* --prerelease --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
      - name: Upload test and lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-test-reports
          path: app/build/reports/
          retention-days: 14
          if-no-files-found: ignore
