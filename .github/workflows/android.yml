name: Build private Android APK

on:
  push:
    branches: [main, "fix/mobile-*", "feature/mobile-youtube-smarttube"]
    paths:
      - "app/**"
      - "smarttube/**"
      - "third_party/**"
      - "*.gradle.kts"
      - ".gitmodules"
      - "gradle.properties"
      - "gradle/**"
      - "tools/**"
      - "progress.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-private-android-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout private source and SmartTube submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore SmartTube nested dependencies
        run: |
          set -euxo pipefail
          if [ ! -d third_party/SmartTube-droid/.git ]; then
            rm -rf third_party/SmartTube-droid
            git clone --depth 1 --recurse-submodules https://github.com/systematiq-one/SmartTube-droid.git third_party/SmartTube-droid
          fi
          git -C third_party/SmartTube-droid submodule sync --recursive
          git -C third_party/SmartTube-droid submodule update --init --force --recursive
          test -f third_party/SmartTube-droid/SharedModules/constants.gradle
          test -f third_party/SmartTube-droid/MediaServiceCore/core_settings.gradle

      - name: Patch SmartTube legacy Gradle modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('third_party/SmartTube-droid')
          changed=[]
          for p in sorted(root.rglob('build.gradle')):
              if '/gradle/' in p.as_posix():
                  continue
              text=p.read_text(errors='ignore')
              original=text
              manifest=p.parent/'src/main/AndroidManifest.xml'
              pkg=None
              if manifest.is_file():
                  m=re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']',manifest.read_text(errors='ignore'))
                  if m: pkg=m.group(1)
              if re.search(r'\bandroid\s*\{',text):
                  if pkg and not re.search(r'\bnamespace\s*[= ]',text):
                      text=re.sub(r'(\bandroid\s*\{)',r'\1\n    namespace "'+pkg+'"',text,count=1)
                  if not re.search(r'\bcompileSdkVersion\s+[^\n]+',text) and not re.search(r'\bcompileSdk\s*[= ]',text):
                      text=re.sub(r'(\bandroid\s*\{)',r'\1\n    compileSdkVersion project.properties.compileSdkVersion',text,count=1)
                  # All vendored SmartTube modules receive a device dimension.
                  # Existing SmartTube st* flavors MUST explicitly belong to the
                  # legacy default dimension when a second dimension is present.
                  dm=re.search(r'(?m)^(\s*)flavorDimensions\s+(.+)$',text)
                  if dm:
                      rhs=dm.group(2).strip()
                      if '"device"' not in rhs and "'device'" not in rhs:
                          text=text[:dm.start()]+dm.group(1)+'flavorDimensions '+rhs+', "device"'+text[dm.end():]
                  else:
                      text=re.sub(r'(\bandroid\s*\{)',r'\1\n    flavorDimensions "device"',text,count=1)
                  if not re.search(r'\bmobile\s*\{\s*dimension\s+["\']device["\']',text,re.S):
                      # Add a dedicated device flavor block; this is intentionally
                      # separate from existing default-dimension flavors.
                      text=re.sub(r'(\bandroid\s*\{)',r'\1\n    productFlavors {\n        mobile { dimension "device" }\n    }',text,count=1)
                  # Fix every legacy SmartTube flavor, not just appupdatechecker2.
                  for flavor in ('stbeta','ststable','stfdroid'):
                      text=re.sub(rf'(?m)^(\s*){flavor}\s*\{{\s*\}}',rf'\1{flavor} {{ dimension "default" }}',text)
                  text=re.sub(r'(?m)^(\s*)classifier\s+["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",text)
                  text=re.sub(r'(?m)^(\s*)classifier\s*=\s*["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",text)
              if text!=original:
                  p.write_text(text)
                  changed.append(str(p))
          # Hard verification: every legacy flavor declaration must carry default.
          bad=[]
          for p in root.rglob('build.gradle'):
              t=p.read_text(errors='ignore')
              for f in ('stbeta','ststable','stfdroid'):
                  if re.search(rf'(?m)^\s*{f}\s*\{{\s*\}}',t): bad.append(f'{p}:{f}')
          if bad:
              raise SystemExit('Unpatched legacy flavors: '+', '.join(bad))
          assert any(x.endswith('filepicker-lib/build.gradle') for x in changed), 'filepicker classifier patch missing'
          print('Patched SmartTube modules:',len(changed))
          print('Verified all st* flavors have explicit default dimension')
          PY

      - name: Verify Mobile SmartTube flavor mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('smarttube/build.gradle.kts')
          t=p.read_text()
          t=t.replace('missingDimensionStrategy("device", "mobile")\n','')
          anchor='missingDimensionStrategy("default", "ststable")'
          if anchor not in t: raise SystemExit('SmartTube default flavor strategy missing')
          # The vendored modules are normalized to a device dimension by CI.
          if 'missingDimensionStrategy("device", "mobile")' not in t:
              t=t.replace(anchor,anchor+'\n        missingDimensionStrategy("device", "mobile")',1)
          p.write_text(t)
          print('Verified SmartTube strategies: default=ststable, device=mobile')
          PY

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;30.0.3" "build-tools;36.0.0"

      - name: Diagnose SmartTube Gradle configuration
        run: |
          sed -n '1,180p' third_party/SmartTube-droid/SharedModules/appupdatechecker2/build.gradle
          gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 :appupdatechecker2:tasks --stacktrace

      - name: Compile, test and lint Mobile
        run: gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 testMobileDebugUnitTest lintMobileDebug assembleMobileDebug

      - name: Read Mobile version
        id: mobile_version
        run: |
          version="$(grep -m1 'versionName = \"' app/build.gradle.kts | cut -d'\"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify and package Mobile APK
        run: |
          mkdir -p dist/mobile
          apk="dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          if unzip -l "$apk" | grep -q 'libvlc\.so'; then exit 1; fi
          (cd dist/mobile && sha256sum "NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk" | tee SHA256SUMS.txt)

      - name: Upload Mobile APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}-APK
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error

      - name: Prepare Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Smoke-test Mobile APK on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 420
          disable-animations: true
          disable-spellchecker: true
          script: python3 tools/android_smoke_current.py dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: Android-test-reports
          path: app/build/reports/
          retention-days: 14
          if-no-files-found: ignore
