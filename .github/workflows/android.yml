name: Build private Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-private-android-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile, test and lint
        run: gradle --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Verify and package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Nm7-IPTV-1.7.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Nm7-IPTV-1.7.apk
          cd dist
          sha256sum Nm7-IPTV-1.7.apk | tee SHA256SUMS.txt
      - name: Upload installable APK (private artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Nm7-IPTV-1.7-APK
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare synthetic playback tests
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Check app on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          disable-animations: true
          disable-spellchecker: true
          script: python3 tools/android_smoke.py dist/Nm7-IPTV-1.7.apk
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-emulator-smoke
          path: smoke-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14
          if-no-files-found: ignore
