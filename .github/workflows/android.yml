name: Build private Android APK

on:
  push:
    branches: [main, "fix/mobile-*", "feature/mobile-youtube-smarttube"]
    paths:
      - "app/**"
      - "smarttube/**"
      - "third_party/**"
      - "*.gradle.kts"
      - ".gitmodules"
      - "gradle.properties"
      - "gradle/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iptv-private-android-build
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout private source and SmartTube submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;30.0.3" "build-tools;36.0.0"
      - name: Inject and verify Mobile sleep timer + YouTube entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/vn/phuong/iptvplayer/MainActivity.java")
          text = p.read_text()
          old_items = 'List<String> items=new ArrayList<>(java.util.Arrays.asList("Quản lý nguồn IPTV","Thêm hoặc mở URL/tệp","Tải lại playlist hiện tại","Lịch phát sóng (EPG)","Giao diện: "+modeLabel,"Đổi hình nền",urls,rows,fps,clock,playerSource));'
          new_items = 'List<String> items=new ArrayList<>(java.util.Arrays.asList("Quản lý nguồn IPTV","Thêm hoặc mở URL/tệp","Tải lại playlist hiện tại","Lịch phát sóng (EPG)","Giao diện: "+modeLabel,"Đổi hình nền",urls,rows,fps,clock,playerSource,"Hẹn giờ đóng app","YouTube"));'
          old_handler = 'if(which==10)AppPreferences.setShowPlayerSource(this,!AppPreferences.showPlayerSource(this));'
          new_handler = old_handler + '\n                    if(which==11)SleepTimer.showDialog(this);\n                    if(which==12)startActivity(new Intent(this,YoutubeActivity.class));'
          old_create = '@Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); setupViews(); restoreSession(); epgHandler.post(epgTick); }'
          new_create = '@Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); setupViews(); SleepTimer.restore(this); restoreSession(); epgHandler.post(epgTick); }'
          if '"YouTube"' not in text:
              if old_items not in text: raise SystemExit('YouTube injection failed: settings item block not found')
              if old_handler not in text: raise SystemExit('YouTube injection failed: settings handler not found')
              text = text.replace(old_items, new_items, 1)
              text = text.replace(old_handler, new_handler, 1)
          if 'SleepTimer.restore(this)' not in text:
              if old_create not in text: raise SystemExit('Sleep timer injection failed: onCreate block not found')
              text = text.replace(old_create, new_create, 1)
          p.write_text(text)
          verify = p.read_text()
          for needle in ('"Hẹn giờ đóng app"', 'SleepTimer.showDialog(this)', 'SleepTimer.restore(this)', '"YouTube"', 'YoutubeActivity.class'):
              if needle not in verify: raise SystemExit(f'Missing injected feature: {needle}')
          print('Sleep timer + YouTube source injection verified')
          PY
      - name: Compile, test and lint Mobile
        run: gradle --no-daemon --console=plain testMobileDebugUnitTest lintMobileDebug assembleMobileDebug
      - name: Read Mobile version
        id: mobile_version
        run: |
          version="$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d'"' -f2)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify and package Mobile APK
        run: |
          mkdir -p dist/mobile
          apk="dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          if unzip -l "$apk" | grep -q 'libvlc\\.so'; then
            echo 'Mobile APK unexpectedly contains LibVLC' >&2
            exit 1
          fi
          (cd dist/mobile && sha256sum "NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk" | tee SHA256SUMS.txt)
      - name: Upload Mobile APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}-APK
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error
      - name: Prepare Android emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Smoke-test Mobile APK on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          emulator-boot-timeout: 420
          disable-animations: true
          disable-spellchecker: true
          script: python3 tools/android_smoke_current.py dist/mobile/NM7-IPTV-Mobile-${{ steps.mobile_version.outputs.version }}.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Android-test-reports
          path: app/build/reports/
          retention-days: 14
          if-no-files-found: ignore
