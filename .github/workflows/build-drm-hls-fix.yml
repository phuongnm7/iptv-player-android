name: Build NM7 DRM-HLS Fix APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-drm-hls-fix.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore SmartTube submodule
        run: |
          if [ ! -d third_party/SmartTube-droid/.git ]; then
            rm -rf third_party/SmartTube-droid
            git clone --depth 1 --recurse-submodules https://github.com/systematiq-one/SmartTube-droid.git third_party/SmartTube-droid
          fi
          git -C third_party/SmartTube-droid submodule update --init --force --recursive
      - name: Patch SmartTube legacy Android modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("third_party/SmartTube-droid")
          for p in root.rglob("build.gradle"):
              if "/gradle/" in p.as_posix(): continue
              t=p.read_text(errors="ignore")
              if not re.search(r'\bandroid\s*\{',t): continue
              manifest=p.parent/"src/main/AndroidManifest.xml"
              if not manifest.exists(): continue
              m=re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']',manifest.read_text(errors="ignore"))
              if not m: continue
              changed=False
              if not re.search(r'\bnamespace\s*[= ]',t):
                  t=re.sub(r'(\bandroid\s*\{)',r'\1\n    namespace "'+m.group(1)+'"',t,count=1)
                  changed=True
              if not re.search(r'\bcompileSdkVersion\s+',t) and not re.search(r'\bcompileSdk\s*[= ]',t):
                  t=re.sub(r'(\bandroid\s*\{)',r'\1\n    compileSdkVersion project.properties.compileSdkVersion',t,count=1)
                  changed=True
              t2=re.sub(r'(?m)^(\s*)classifier\s+["\']([^"\']+)["\']\s*
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
      - name: Build mobile
        run: gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 assembleMobileDebug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-Mobile-DRM-HLS-Fix
          path: dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
          retention-days: 30
,r"\1archiveClassifier.set('\2')",t)
              t2=re.sub(r'(?m)^(\s*)classifier\s*=\s*["\']([^"\']+)["\']\s*
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
      - name: Build mobile
        run: gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 assembleMobileDebug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-Mobile-DRM-HLS-Fix
          path: dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
          retention-days: 30
,r"\1archiveClassifier.set('\2')",t2)
              if t2!=t: t=t2; changed=True
              if changed: p.write_text(t)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false
      - name: Build mobile
        run: gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 assembleMobileDebug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-Mobile-DRM-HLS-Fix
          path: dist/NM7-IPTV-Mobile-DRM-HLS-Fix.apk
          retention-days: 30
