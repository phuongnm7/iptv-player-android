name: Apply fresh playlist reload patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch_fresh_playlist_reload.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch playlist reload and bump Android version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/vn/phuong/iptvplayer/MainActivity.java')
          text = main.read_text(encoding='utf-8')

          needle = 'c=(HttpURLConnection)new URL(source).openConnection();'
          replacement = '''URL requestUrl=new URL(source);
                    if("raw.githubusercontent.com".equalsIgnoreCase(requestUrl.getHost())){
                        String separator=source.contains("?")?"&":"?";
                        requestUrl=new URL(source+separator+"_nm7_reload="+System.currentTimeMillis());
                    }
                    c=(HttpURLConnection)requestUrl.openConnection();
                    c.setUseCaches(false);'''
          if text.count(needle) != 1:
              raise SystemExit(f'Expected connection line exactly once, got {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          ua_old = 'c.setRequestProperty("User-Agent",tv?"Nm7-IPTV/1.10.11 Android-TV":"Nm7-IPTV/1.10.11 Android");'
          ua_new = 'c.setRequestProperty("User-Agent",tv?"Nm7-IPTV/1.10.17 Android-TV":"Nm7-IPTV/1.10.17 Android");'
          if text.count(ua_old) != 1:
              raise SystemExit(f'Expected User-Agent line exactly once, got {text.count(ua_old)}')
          text = text.replace(ua_old, ua_new, 1)

          connection = 'c.setRequestProperty("Connection","keep-alive");'
          no_cache = '''c.setRequestProperty("Connection","keep-alive");
                    c.setRequestProperty("Cache-Control","no-cache, no-store, max-age=0");
                    c.setRequestProperty("Pragma","no-cache");'''
          if text.count(connection) != 1:
              raise SystemExit(f'Expected Connection header line exactly once, got {text.count(connection)}')
          text = text.replace(connection, no_cache, 1)
          main.write_text(text, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          if text.count('versionCode = 33') != 1 or text.count('versionName = "1.10.16"') != 1:
              raise SystemExit('Unexpected Android version before patch')
          text = text.replace('versionCode = 33', 'versionCode = 34', 1)
          text = text.replace('versionName = "1.10.16"', 'versionName = "1.10.17"', 1)
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Commit app patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/vn/phuong/iptvplayer/MainActivity.java app/build.gradle.kts
          git commit -m 'Force fresh playlist reload on Android 1.10.17'
          git push origin HEAD:main
