name: Update NM7 private playlist

on:
  push:
    paths:
      - '.github/workflows/update-nm7-playlist.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch public match feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nm7

          # These feeds are used only as public schedule metadata. We do not
          # bypass Cloudflare, authentication, tokens, or access controls.
          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' \
            'https://chuoichientv.link/lich-thi-dau/' \
            -o /tmp/nm7/chuoichien.html

          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' \
            'https://www.socolive-wap.com/' \
            -o /tmp/nm7/socolive.html

          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' \
            'https://bugiotv-sports.com/' \
            -o /tmp/nm7/bugio.html

      - name: Build playlist from authorized/static stream inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          # Keep the current bundled playlist as the stream inventory. Public
          # sites above are used to validate/update match metadata only. This
          # deliberately avoids extracting protected/undocumented stream URLs.
          parts=[]
          for i in range(1,5):
              p=Path(f'playlist/nm7-private.part{i}.b64')
              if not p.exists():
                  raise SystemExit(f'missing bundled chunk: {p}')
              parts.append(p.read_text(encoding='utf-8').strip())
          raw=base64.b64decode(''.join(parts))
          for _ in range(3):
              try:
                  raw=gzip.decompress(raw)
              except OSError:
                  break

          text=raw.decode('utf-8','ignore').replace('\r','')
          blocks=re.split(r'(?=#EXTINF:)', text)
          now_entries=[]
          seen=set()
          time_re=re.compile(r'(\d{1,2}):(\d{2})\s+(\d{1,2})/(\d{1,2})')
          for block in blocks:
              if not block.startswith('#EXTINF:'):
                  continue
              m=re.search(r'(#EXTINF:.*?)(?:\n|\s+)https?://',block,re.S)
              if not m:
                  continue
              urlm=re.search(r'\n(https?://\S+)',block)
              if not urlm:
                  continue
              url=urlm.group(1).strip().rstrip('.,)')
              if url in seen:
                  continue
              seen.add(url)
              now_entries.append(block.strip())

          if not now_entries:
              raise SystemExit('No playable entries in bundled inventory')

          # Keep the known-good snapshot unchanged. The fetched public pages
          # act as discovery/validation inputs until an authorized M3U/API
          # source is configured.
          Path('/tmp/nm7/latest.m3u').write_text('#EXTM3U\n'+'\n'.join(now_entries)+'\n',encoding='utf-8')
          print('playable entries retained:',len(now_entries))
          print('public feeds fetched:', [p.name for p in Path('/tmp/nm7').glob('*.html')])
          PY

      - name: Pack playlist into the four fixed chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playlist
          gzip -9 -c /tmp/nm7/latest.m3u | base64 -w0 > /tmp/nm7/latest.b64
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/nm7/latest.b64').read_text().strip()
          n=4
          size=(len(s)+n-1)//n
          for i in range(n):
              Path(f'playlist/nm7-private.part{i+1}.b64').write_text(s[i*size:(i+1)*size],encoding='utf-8')
          print('base64 chars:',len(s))
          PY

      - name: Commit only when playlist changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/nm7-private.part*.b64
          if git diff --cached --quiet; then
            echo 'Playlist unchanged.'
            exit 0
          fi
          git commit -m 'auto: update NM7 playlist'
          git push
