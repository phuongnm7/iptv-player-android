name: Update NM7 private playlist

on:
  push:
    paths:
      - '.github/workflows/update-nm7-playlist.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch current public match schedule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nm7
          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' \
            -H 'Cache-Control: no-cache' \
            'https://chuoichientv.link/lich-thi-dau/' \
            -o /tmp/nm7/chuoichien.html
          test -s /tmp/nm7/chuoichien.html

      - name: Merge fresh matches into the existing NM7 stream inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          from html import unescape

          # Reconstruct the current bundled playlist first. This preserves all
          # existing NM7 groups (Vua San Co, Socolive, Giu Vang, etc.) instead
          # of replacing them with one schedule source.
          packed=''.join(Path(f'playlist/nm7-private.part{i}.b64').read_text(encoding='utf-8').strip() for i in range(1,5))
          raw=base64.b64decode(packed)
          for _ in range(3):
              try: raw=gzip.decompress(raw)
              except OSError: break
          source=raw.decode('utf-8','ignore').replace('\r','')

          # Keep every existing playable EXTINF entry exactly as supplied by
          # the user, deduplicated by stream URL.
          blocks=re.split(r'(?=#EXTINF:)', source)
          existing=[]
          seen_urls=set()
          for block in blocks:
              if not block.startswith('#EXTINF:'):
                  continue
              m=re.search(r'(?<!["=])(https?://[^\s#]+)', block, re.I)
              if not m:
                  continue
              url=m.group(1).rstrip('.,)')
              if url == 'None' or url in seen_urls:
                  continue
              seen_urls.add(url)
              existing.append(block.strip())

          channels={
              'Chuối Lá': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoilahd/playlist.m3u8',
              'Chuối Nhỏ': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoinhohd/playlist.m3u8',
              'Chuối To': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoitohd/playlist.m3u8',
              'Chuối Chao': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoichaohd/playlist.m3u8',
              'Chuối Kem': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoikemhd/playlist.m3u8',
              'Chuối Tây': 'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoitayhd/playlist.m3u8',
          }
          referrer='https://live.chuoichien.tv/'
          html=Path('/tmp/nm7/chuoichien.html').read_text(encoding='utf-8',errors='ignore')

          generated=[]
          rows=re.findall(r'<tr[^>]*>(.*?)</tr>',html,re.I|re.S)
          for row in rows:
              cells=re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>',row,re.I|re.S)
              cells=[re.sub(r'<[^>]+>',' ',c) for c in cells]
              cells=[re.sub(r'\s+',' ',unescape(c)).strip() for c in cells]
              if len(cells)<4: continue
              match=next((c for c in cells if re.search(r'\bvs\b',c,re.I)),None)
              tm=next((re.search(r'\b\d{1,2}:\d{2}\b',c) for c in cells),None)
              if not match or not tm: continue
              blv=cells[3]
              channel=next((k for k in channels if k.lower() in blv.lower()),None)
              if not channel: continue
              label=f'{tm.group(0)} ⚽ {match} ({channel}) [FHD] [hls]'
              generated.append('\n'.join([
                  f'#EXTINF:-1 group-title="Chuối Chiên TV", {label}',
                  f'#EXTVLCOPT:http-referrer={referrer}',
                  channels[channel],
              ]))

          # Fallback for markup changes: parse visible text for time + match + BLV.
          if not generated:
              text=re.sub(r'<script.*?</script>|<style.*?</style>',' ',html,flags=re.I|re.S)
              text=re.sub(r'<[^>]+>','\n',text)
              text=re.sub(r'\s+',' ',unescape(text))
              pat=re.compile(r'(\d{1,2}:\d{2})\s+(.{3,120}?\s+vs\s+.{3,120}?)(?:\s+)(Chuối\s+(?:Lá|Nhỏ|To|Chao|Kem|Tây))\b',re.I)
              for m in pat.finditer(text):
                  channel=next((k for k in channels if k.lower()==m.group(3).lower()),None)
                  if channel:
                      generated.append('\n'.join([
                          f'#EXTINF:-1 group-title="Chuối Chiên TV", {m.group(1)} ⚽ {m.group(2).strip()} ({channel}) [FHD] [hls]',
                          f'#EXTVLCOPT:http-referrer={referrer}',
                          channels[channel],
                      ]))

          # Add only newly discovered schedule entries. Existing playlist remains
          # the source of truth for stream URLs; the public page supplies only
          # current match metadata and channel assignment.
          new_entries=[]
          for entry in generated:
              url=entry.splitlines()[-1].strip()
              if url not in seen_urls:
                  seen_urls.add(url)
                  new_entries.append(entry)

          all_entries=existing+new_entries
          if not all_entries:
              raise SystemExit('No playable NM7 entries available')

          out='#EXTM3U\n'+'\n'.join(all_entries)+'\n'
          Path('/tmp/nm7/latest.m3u').write_text(out,encoding='utf-8')
          print('existing entries:',len(existing))
          print('fresh schedule entries:',len(new_entries))
          print('final entries:',len(all_entries))
          PY

      - name: Pack playlist into four fixed chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playlist
          gzip -9 -c /tmp/nm7/latest.m3u | base64 -w0 > /tmp/nm7/latest.b64
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/nm7/latest.b64').read_text().strip(); n=4
          size=(len(s)+n-1)//n
          for i in range(n):
              Path(f'playlist/nm7-private.part{i+1}.b64').write_text(s[i*size:(i+1)*size],encoding='utf-8')
          print('base64 chars:',len(s))
          PY

      - name: Commit only when playlist changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/nm7-private.part*.b64
          if git diff --cached --quiet; then
            echo 'Playlist unchanged.'
            exit 0
          fi
          git commit -m 'auto: update NM7 playlist from current match schedule'
          git push
