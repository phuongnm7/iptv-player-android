name: Update NM7 private playlist

on:
  push:
    paths:
      - '.github/workflows/update-nm7-playlist.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  NM7_SOURCE_URL: ${{ vars.NM7_SOURCE_URL }}

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch latest source playlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nm7
          if [ -z "${NM7_SOURCE_URL:-}" ]; then
            echo "ERROR: Repository variable NM7_SOURCE_URL is not configured."
            echo "Add a direct M3U/M3U8/playlist URL that you are authorized to use."
            exit 1
          fi

          echo "Fetching configured source..."
          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' \
            -H 'Accept: text/plain,text/*;q=0.9,*/*;q=0.8' \
            -H 'Cache-Control: no-cache' \
            "$NM7_SOURCE_URL" -o /tmp/nm7/source.txt

          if ! grep -aq '#EXTM3U' /tmp/nm7/source.txt; then
            echo "ERROR: Configured source did not return a valid M3U playlist."
            head -c 500 /tmp/nm7/source.txt || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/nm7/source.txt').read_text(encoding='utf-8', errors='ignore').replace('\r','')
          start = text.find('#EXTM3U')
          text = re.sub(r'```(?:m3u|text)?\s*', '', text[start:], flags=re.I).replace('```', '')
          blocks = re.split(r'(?=#EXTINF:)', text)
          out = ['#EXTM3U']
          seen = set()
          for block in blocks[1:]:
              block = block.strip()
              if not block.startswith('#EXTINF:'):
                  continue
              lines = [x.strip() for x in block.split('\n') if x.strip()]
              if not any(x.startswith(('http://','https://')) for x in lines[1:]):
                  continue
              key = '\n'.join(lines)
              if key in seen:
                  continue
              seen.add(key)
              out.extend(lines)
          if len(out) <= 1:
              raise SystemExit('No playable #EXTINF entries found')
          Path('/tmp/nm7/latest.m3u').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('entries:', len(out) - 1)
          PY

      - name: Pack playlist into the four fixed chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playlist
          gzip -9 -c /tmp/nm7/latest.m3u | base64 -w0 > /tmp/nm7/latest.b64
          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/nm7/latest.b64').read_text().strip()
          n = 4
          size = (len(s) + n - 1) // n
          for i in range(n):
              Path(f'playlist/nm7-private.part{i+1}.b64').write_text(s[i*size:(i+1)*size], encoding='utf-8')
          print('base64 chars:', len(s))
          PY

      - name: Commit only when playlist changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/nm7-private.part*.b64
          if git diff --cached --quiet; then
            echo 'Playlist unchanged.'
            exit 0
          fi
          git commit -m 'auto: update NM7 playlist'
          git push
