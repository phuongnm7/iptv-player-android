name: Update NM7 private playlist

on:
  push:
    paths:
      - '.github/workflows/update-nm7-playlist.yml'
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  NM7_SOURCE_URL: ${{ vars.NM7_SOURCE_URL }}

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare latest source playlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nm7

          if [ -n "${NM7_SOURCE_URL:-}" ]; then
            echo "Fetching configured source..."
            curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
              -A 'Mozilla/5.0' \
              -H 'Accept: text/plain,text/*;q=0.9,*/*;q=0.8' \
              -H 'Cache-Control: no-cache' \
              "$NM7_SOURCE_URL" -o /tmp/nm7/source.txt

            if ! grep -aq '#EXTM3U' /tmp/nm7/source.txt; then
              echo "ERROR: Configured source did not return a valid M3U playlist."
              head -c 500 /tmp/nm7/source.txt || true
              exit 1
            fi
          else
            echo "NM7_SOURCE_URL is not configured; using the current bundled playlist as a safe snapshot."
            python3 - <<'PY'
            from pathlib import Path
            import base64, gzip
            parts=[]
            for i in range(1,5):
                p=Path(f'playlist/nm7-private.part{i}.b64')
                if not p.exists():
                    raise SystemExit(f'missing bundled chunk: {p}')
                parts.append(p.read_text(encoding='utf-8').strip())
            raw=base64.b64decode(''.join(parts))
            for _ in range(3):
                try:
                    raw=gzip.decompress(raw)
                except OSError:
                    break
            Path('/tmp/nm7/source.txt').write_bytes(raw)
            PY
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/nm7/source.txt').read_text(encoding='utf-8', errors='ignore').replace('\r','')
          text = re.sub(r'```(?:m3u|text)?\s*', '', text, flags=re.I).replace('```', '')
          start = text.find('#EXTM3U')
          if start < 0:
              raise SystemExit('No #EXTM3U marker found')
          text = text[start:]

          # Parse both normal multi-line M3U and the one-line format used by the supplied snapshot.
          pattern = re.compile(r'(#EXTINF:[^\n#]*?)(?:\s+(#EXTVLCOPT:[^\n#]*?))?\s+(https?://[^\s#]+)', re.I)
          entries=[]
          seen=set()
          for m in pattern.finditer(text):
              ext=m.group(1).strip()
              opt=(m.group(2) or '').strip()
              url=m.group(3).strip().rstrip('.,)')
              key=(ext,opt,url)
              if key in seen:
                  continue
              seen.add(key)
              entries.append((ext,opt,url))

          if not entries:
              raise SystemExit('No playable #EXTINF entries found')

          out=['#EXTM3U']
          for ext,opt,url in entries:
              out.append(ext)
              if opt:
                  out.append(opt)
              out.append(url)
          Path('/tmp/nm7/latest.m3u').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('playable entries:',len(entries))
          print('playlist bytes:',Path('/tmp/nm7/latest.m3u').stat().st_size)
          PY

      - name: Pack playlist into the four fixed chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p playlist
          gzip -9 -c /tmp/nm7/latest.m3u | base64 -w0 > /tmp/nm7/latest.b64
          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/nm7/latest.b64').read_text().strip()
          n = 4
          size = (len(s) + n - 1) // n
          for i in range(n):
              Path(f'playlist/nm7-private.part{i+1}.b64').write_text(s[i*size:(i+1)*size], encoding='utf-8')
          print('base64 chars:', len(s))
          PY

      - name: Commit only when playlist changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/nm7-private.part*.b64
          if git diff --cached --quiet; then
            echo 'Playlist unchanged.'
            exit 0
          fi
          git commit -m 'auto: update NM7 playlist'
          git push
