name: NM7 Mobile Final Build

on:
  push:
    branches: ["fix/mobile-1.10.26-sleep-timer-icon"]
    paths:
      - "app/**"
      - "smarttube/**"
      - ".github/workflows/android-mobile-final.yml"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive

      - name: Restore SmartTube phone UI and merge latest upstream engine
        run: |
          set -euxo pipefail
          rm -rf third_party/SmartTube-droid
          git clone --depth 1 --recurse-submodules https://github.com/systematiq-one/SmartTube-droid.git third_party/SmartTube-droid
          git -C third_party/SmartTube-droid submodule update --init --force --recursive
          git -C third_party/SmartTube-droid remote add upstream https://github.com/yuliskov/SmartTube.git
          git -C third_party/SmartTube-droid fetch --depth 1 upstream refs/tags/32.47s
          git -C third_party/SmartTube-droid merge --no-edit FETCH_HEAD
          git -C third_party/SmartTube-droid submodule update --init --force --recursive
          echo "SmartTube phone UI base: systematiq-one/master"
          echo "Merged upstream SmartTube stable: 32.47s (51e87ab4ad57ae672fc24bd216427d3e81bbddb7)"

      - name: Patch SmartTube for AGP 8.13
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('third_party/SmartTube-droid')
          for p in root.rglob('build.gradle'):
              if '.git' in p.parts: continue
              t=p.read_text(errors='ignore'); orig=t
              mfile=p.parent/'src/main/AndroidManifest.xml'; pkg=None
              if mfile.is_file():
                  m=re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']',mfile.read_text(errors='ignore'))
                  if m: pkg=m.group(1)
              if 'android {' in t:
                  if pkg and not re.search(r'\bnamespace\s',t): t=re.sub(r'(android\s*\{)',r'\1\n    namespace "'+pkg+'"',t,1)
                  if not re.search(r'compileSdkVersion|compileSdk\s*[= ]',t): t=re.sub(r'(android\s*\{)',r'\1\n    compileSdkVersion project.properties.compileSdkVersion',t,1)
                  if 'flavorDimensions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    flavorDimensions "device"',t,1)
                  elif '"device"' not in re.search(r'flavorDimensions[^\n]*',t).group(0): t=re.sub(r'(flavorDimensions\s+[^\n]+)',r'\1, "device"',t,1)
                  if not re.search(r'\bmobile\s*\{\s*dimension\s+["\']device["\']',t,re.S): t=re.sub(r'(android\s*\{)',r'\1\n    productFlavors { mobile { dimension "device" } }',t,1)
                  for f in ('stbeta','ststable','stfdroid'): t=re.sub(r'(?m)^(\s*)'+f+r'\s*\{\s*\}',lambda m:m.group(1)+f+' { dimension "default" }',t)
                  t=re.sub(r'(?m)^(\s*)classifier\s+["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  t=re.sub(r'(?m)^(\s*)classifier\s*=\s*["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  if 'kotlin-android' in t and 'kotlinOptions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    kotlinOptions { jvmTarget = "1.8" }',t,1)
              if t!=orig: p.write_text(t)
          PY

      - name: Patch SmartTube Mobile UI and playback lifecycle
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('third_party/SmartTube-droid')

          # Mobile feed: use a real one-column RecyclerView, not runtime reflection.
          browse = root / 'smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/browse/BrowseActivity.java'
          t = browse.read_text()
          t2 = t.replace('private static final int GRID_COLUMNS = 1;', 'private static final int GRID_COLUMNS = 1;')
          if t2 == t:
              raise SystemExit('Browse GRID_COLUMNS declaration not found')
          browse.write_text(t2)

          # Channel uploads: force the layout manager to one column without
          # assuming this upstream class declares a GRID_COLUMNS constant.
          uploads = root / 'smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/channeluploads/ChannelUploadsActivity.java'
          if uploads.is_file():
              u = uploads.read_text()
              u2 = u.replace('private static final int GRID_COLUMNS = 2;', 'private static final int GRID_COLUMNS = 1;')
              u2 = u2.replace('new GridLayoutManager(this, GRID_COLUMNS)', 'new GridLayoutManager(this, 1)')
              uploads.write_text(u2)

          # Mobile player: preserve the ExoPlayer instance during NM7 tab switches.
          # NM7 sets a short-lived process property before bringing the other tab to front.
          playback = root / 'smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java'
          t = playback.read_text()
          t2 = t.replace('import android.content.Context;\n', 'import android.content.Context;\nimport android.content.Intent;\n')
          old_stop = '''    @Override
    protected void onStop() {
        super.onStop();

        if (VERSION.SDK_INT > 23) {
            maybeReleasePlayer();
        }
    }'''
          new_stop = '''    @Override
    protected void onStop() {
        super.onStop();

        // NM7 tab navigation must not destroy the YouTube player.
        if (VERSION.SDK_INT > 23 && !isNm7TabSwitch()) {
            maybeReleasePlayer();
        }
    }

    private boolean isNm7TabSwitch() {
        try {
            String until = System.getProperty("nm7.tab.switch.until", "0");
            return Long.parseLong(until) > System.currentTimeMillis();
        } catch (RuntimeException ignored) {
            return false;
        }
    }'''
          if old_stop not in t2:
              raise SystemExit('PlaybackActivity onStop block not found')
          t2 = t2.replace(old_stop, new_stop)

          # Back from the player always returns to the phone Browse screen.
          old_back = '''    @Override
    public void onBackPressed() {
        mIsBackPressed = true;

        super.onBackPressed();
    }'''
          new_back = '''    @Override
    public void onBackPressed() {
        if (mIsBackPressed) {
            return;
        }

        mIsBackPressed = true;
        try {
            Intent intent = new Intent(this,
                    Class.forName("com.liskovsoft.smartyoutubetv2.droid.ui.browse.BrowseActivity"));
            intent.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_NO_ANIMATION);
            startActivity(intent);
            overridePendingTransition(0, 0);
            finish();
            overridePendingTransition(0, 0);
        } catch (ReflectiveOperationException | RuntimeException e) {
            super.onBackPressed();
        }
    }'''
          if old_back not in t2:
              raise SystemExit('PlaybackActivity onBackPressed block not found')
          t2 = t2.replace(old_back, new_back)
          playback.write_text(t2)
          print('Patched SmartTube phone feed to 1 column and preserved player across NM7 tab switches')
          PY

      - name: Patch SmartTube show_buffering resource collision
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('third_party/SmartTube-droid')
          changed=0
          for base in (
              root/'exoplayer-amzn-2.10.6/library/ui/src/main/java',
              root/'exoplayer-amzn-2.10.6/library/ui/src/main/res',
          ):
              if not base.is_dir(): continue
              for p in base.rglob('*'):
                  if p.suffix not in {'.java','.xml'}: continue
                  t=p.read_text(errors='ignore')
                  n=t.replace('show_buffering','st_show_buffering')
                  if n != t:
                      p.write_text(n)
                      changed += 1
          print('Renamed SmartTube legacy show_buffering references:',changed)
          if changed == 0: raise SystemExit('SmartTube show_buffering patch found no references')
          PY

      - name: Patch SmartTube source compatibility
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('third_party/SmartTube-droid/SharedModules/sharedutils/src/main/java/com/liskovsoft/sharedutils/okhttp/DohProviders.kt')
          t=p.read_text(); t=t.replace('import okhttp3.toHttpUrlOrNull\n','').replace('return s.toHttpUrlOrNull() ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)').replace('return HttpUrl.parse(s) ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)'); p.write_text(t)
          if 'HttpUrl.parse(' in t or 'toHttpUrlOrNull' in t: raise SystemExit('URL parser patch failed')
          root=Path('third_party/SmartTube-droid'); wanted={'auto_frame_rate_applying','proxy_test_error','proxy_test_start','proxy_test_status'}
          pat=re.compile(r'(<string\b[^>]*\bname=["\']('+'|'.join(wanted)+r')["\'][^>]*>)(.*?)(</string>)',re.S); tok=re.compile(r'%(?![0-9]+\$)([sdif])')
          for p in root.rglob('*.xml'):
              if '.git' in p.parts: continue
              x=p.read_text(errors='ignore')
              def repl(m):
                  i=[0]
                  def r(z): i[0]+=1; return f'%{i[0]}${z.group(1)}'
                  return m.group(1)+tok.sub(r,m.group(3))+m.group(4)
              p.write_text(pat.sub(repl,x))
          PY

      - name: Isolate SmartTube legacy player resources from Media3
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('third_party/SmartTube-droid')
          ui = root / 'exoplayer-amzn-2.10.6/library/ui'
          res = ui / 'src/main/res/layout'
          player = ui / 'src/main/java/com/google/android/exoplayer2/ui/PlayerView.java'
          required = [res / 'exo_player_view.xml', res / 'exo_simple_player_view.xml', player]
          for p in required:
              if not p.is_file():
                  raise SystemExit(f'Missing SmartTube player source: {p}')
          shutil.copy2(res / 'exo_player_view.xml', res / 'st_exo_player_view.xml')
          shutil.copy2(res / 'exo_simple_player_view.xml', res / 'st_exo_simple_player_view.xml')
          simple = res / 'st_exo_player_view.xml'
          t = simple.read_text()
          t2 = t.replace('@layout/exo_simple_player_view', '@layout/st_exo_simple_player_view')
          simple.write_text(t2)
          t = player.read_text()
          t2 = t.replace('R.layout.exo_player_view', 'R.layout.st_exo_player_view')
          if t2 == t:
              raise SystemExit('PlayerView layout reference not found')
          player.write_text(t2)
          print('Isolated SmartTube legacy PlayerView resources from Media3')
          PY

      - name: Configure build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Mobile 1.10.26 only
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 -PmobileAbiSplits=true :app:testMobileDebugUnitTest assembleMobileDebug -x :slidableactivity:testMobileDebugUnitTest
          set -euxo pipefail
          merged="app/build/intermediates/merged_manifest/mobileDebug/processMobileDebugManifest/AndroidManifest.xml"
          test -f "$merged"
          ! grep -q 'TvLayoutTunerProvider\|TvStreamRecoveryProvider\|TvPlayerUiProvider\|VlcFallbackActivity' "$merged"
          ! grep -q 'LEANBACK_LAUNCHER' "$merged"
          ! unzip -l app/build/outputs/apk/mobile/debug/app-mobile-arm64-v8a-debug.apk | grep -q 'libvlc\.so'
          ! unzip -l app/build/outputs/apk/mobile/debug/app-mobile-armeabi-v7a-debug.apk | grep -q 'libvlc\.so'
          version="$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d'"' -f2)"
          out="app/build/outputs/apk/mobile/debug"; mkdir -p dist/mobile
          mapfile -t apks < <(find "$out" -maxdepth 1 -type f -name 'app-mobile-*-debug.apk' -printf '%f\n' | sort)
          test "${#apks[@]}" -eq 2
          arm64=""; armv7=""
          for name in "${apks[@]}"; do case "$name" in *arm64-v8a*) arm64="$out/$name";; *armeabi-v7a*) armv7="$out/$name";; *) echo "Unexpected ABI APK: $name"; exit 1;; esac; done
          test -f "$arm64" && test -f "$armv7"
          verify_abi() { local apk="$1"; local expected="$2"; "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"; if unzip -l "$apk" | grep -q 'lib/x86/\|lib/x86_64/\|libvlc\.so'; then exit 1; fi; case "$expected" in arm64-v8a) unzip -l "$apk" | grep -q 'lib/arm64-v8a/' ;; armeabi-v7a) unzip -l "$apk" | grep -q 'lib/armeabi-v7a/' ;; esac; }
          verify_abi "$arm64" "arm64-v8a"; verify_abi "$armv7" "armeabi-v7a"
          cp "$arm64" "dist/mobile/NM7-IPTV-Mobile-${version}-arm64-v8a.apk"; cp "$armv7" "dist/mobile/NM7-IPTV-Mobile-${version}-armeabi-v7a.apk"; sha256sum dist/mobile/*.apk | tee dist/mobile/SHA256SUMS.txt

      - name: Upload Mobile APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: NM7-IPTV-Mobile-FINAL
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error

# CI trigger refresh: Mobile-only 1.10.26; no TV job.
# Budget restored; run Mobile Final CI.
