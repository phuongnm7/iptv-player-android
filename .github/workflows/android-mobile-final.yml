name: NM7 Mobile Final Build

"on":
  push:
    branches: ["fix/mobile-1.10.26-sleep-timer-icon", "fix/mobile-1.10.76-live-chat", "fix/mobile-1.10.83-youtube-player-ui"]
    paths:
      - "app/**"
      - "smarttube/**"
      - "scripts/**"
      - ".github/workflows/android-mobile-final.yml"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: false

      - name: Restore pinned SmartTube phone source
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/systematiq-one/SmartTube-droid.git third_party/SmartTube-droid
          git -C third_party/SmartTube-droid checkout --detach 4825d6aa8b6f1d3181927f9e96c7d89cab13d510
          git -C third_party/SmartTube-droid submodule update --init --recursive

      - name: Patch SmartTube for AGP 8.13
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          root=Path('third_party/SmartTube-droid')
          for p in root.rglob('build.gradle'):
              if '.git' in p.parts: continue
              t=p.read_text(errors='ignore'); orig=t
              mfile=p.parent/'src/main/AndroidManifest.xml'; pkg=None
              if mfile.is_file():
                  m=re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']',mfile.read_text(errors='ignore'))
                  if m: pkg=m.group(1)
              if 'android {' in t:
                  if pkg and not re.search(r'\bnamespace\s',t): t=re.sub(r'(android\s*\{)',r'\1\n    namespace "'+pkg+'"',t,1)
                  if not re.search(r'compileSdkVersion|compileSdk\s*[= ]',t): t=re.sub(r'(android\s*\{)',r'\1\n    compileSdkVersion project.properties.compileSdkVersion',t,1)
                  if 'flavorDimensions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    flavorDimensions "device"',t,1)
                  elif '"device"' not in re.search(r'flavorDimensions[^\n]*',t).group(0): t=re.sub(r'(flavorDimensions\s+[^\n]+)',r'\1, "device"',t,1)
                  if not re.search(r'\bmobile\s*\{\s*dimension\s+["\']device["\']',t,re.S): t=re.sub(r'(android\s*\{)',r'\1\n    productFlavors { mobile { dimension "device" } }',t,1)
                  for f in ('stbeta','ststable','stfdroid'): t=re.sub(r'(?m)^(\s*)'+f+r'\s*\{\s*\}',lambda m:m.group(1)+f+' { dimension "default" }',t)
                  t=re.sub(r'(?m)^(\s*)classifier\s+["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  t=re.sub(r'(?m)^(\s*)classifier\s*=\s*["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  if 'kotlin-android' in t and 'kotlinOptions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    kotlinOptions { jvmTarget = "1.8" }',t,1)
              if t!=orig: p.write_text(t)
          PY

      - name: Patch SmartTube Mobile UI and playback lifecycle
        run: python3 scripts/patch-mobile-v37.py

      - name: Verify NM7 1.10.96 YouTube patch
        run: |
          set -euxo pipefail
          test "$(grep -c 'versionName = \"1.10.96\"' app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionCode = 112' app/build.gradle.kts)" -eq 1
          grep -q 'window.setDecorFitsSystemWindows(true);' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'public void onRenderedFirstFrame()' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'channelThumbnail.thumbnails\[0\].url' third_party/SmartTube-droid/MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/common/models/items/VideoItem.java
          grep -q 'nm7_live_chat_input' third_party/SmartTube-droid/smarttubedroid/src/main/res/layout/playback_activity.xml
          grep -q 'sendLiveChatMessageObserve' third_party/SmartTube-droid/MediaServiceCore/mediaserviceinterfaces/src/main/java/com/liskovsoft/mediaserviceinterfaces/LiveChatService.java
          grep -q 'sendLiveChatMessageEndpoint' third_party/SmartTube-droid/MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/chat/gen/LiveChatResult.kt
          grep -q 'android:paddingBottom="64dp"' third_party/SmartTube-droid/smarttubedroid/src/main/res/layout/playback_activity.xml
          grep -q 'String nm7ChannelThumbnail = item.getChannelThumbnail();' third_party/SmartTube-droid/MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java
          grep -q 'nm7_startup_poster' third_party/SmartTube-droid/smarttubedroid/src/main/res/layout/playback_activity.xml
          grep -q 'mNm7FirstFrameRendered = true;' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'NM7_AVATAR_CACHE' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/shared/VideoCardHolder.java
          grep -q 'nm7.mobile.normalbars' app/src/main/java/vn/phuong/iptvplayer/MobileNm7Application.java
          grep -q 'System.getProperty("nm7.mobile.normalbars")' third_party/SmartTube-droid/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/misc/MotherActivity.java
          grep -q 'FLAG_FORCE_NOT_FULLSCREEN' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'onWindowFocusChanged(boolean hasFocus)' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'startup_poster_hidden reason=' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'nm7ArmPosterReadyFallback' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'nm7ArmPosterRenderProbe' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'renderedOutputBufferCount' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'absolute_safety_timeout' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'mNm7PosterVideoId' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'dontAnimate()' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'list.setClipToPadding(false)' app/src/main/java/vn/phuong/iptvplayer/HomeTabBar.java
          grep -q 'list.getPaddingBottom() + dp(activity, 76)' app/src/main/java/vn/phuong/iptvplayer/HomeTabBar.java
          grep -q 'consumeNm7TransitionPoster' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/shared/VideoCardHolder.java
          grep -q 'startup_poster_source=clicked_card' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'decoder_playback_progress' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'mNm7FirstFramePositionMs' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'BitmapDrawable' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/shared/VideoCardHolder.java
          grep -q 'decoder_playback_progress' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'rendered >= mNm7PosterRenderedBaseline + 3' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'playbackProgressMs >= 120L' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          ! grep -q 'NM7 1.10.83: subtle phone-style player entrance' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
          grep -q 'delaySubscription(650' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/shared/VideoCardHolder.java
          grep -q 'FLAG_ACTIVITY_NO_ANIMATION' third_party/SmartTube-droid/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/app/views/ViewManager.java
          grep -q 'bufferForPlaybackMs = 250' third_party/SmartTube-droid/common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/other/ExoPlayerInitializer.java
          grep -q 'window.setDecorFitsSystemWindows(true);' third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java

      - name: Check Mobile lifecycle regression guards
        run: python3 scripts/verify-mobile-lifecycle.py

      - name: Upload generated lifecycle source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: Mobile-lifecycle-source-proof
          path: |
            dist/mobile-diagnostics/
            third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java
            third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/browse/BrowseActivity.java

      - name: Patch SmartTube show_buffering resource collision
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('third_party/SmartTube-droid')
          changed=0
          for base in (
              root/'exoplayer-amzn-2.10.6/library/ui/src/main/java',
              root/'exoplayer-amzn-2.10.6/library/ui/src/main/res',
          ):
              if not base.is_dir(): continue
              for p in base.rglob('*'):
                  if p.suffix not in {'.java','.xml'}: continue
                  t=p.read_text(errors='ignore')
                  n=t.replace('show_buffering','st_show_buffering')
                  if n != t:
                      p.write_text(n)
                      changed += 1
          print('Renamed SmartTube legacy show_buffering references:',changed)
          if changed == 0: raise SystemExit('SmartTube show_buffering patch found no references')
          PY

      - name: Patch SmartTube source compatibility
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('third_party/SmartTube-droid/SharedModules/sharedutils/src/main/java/com/liskovsoft/sharedutils/okhttp/DohProviders.kt')
          t=p.read_text(); t=t.replace('import okhttp3.toHttpUrlOrNull\n','').replace('return s.toHttpUrlOrNull() ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)').replace('return HttpUrl.parse(s) ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)'); p.write_text(t)
          if 'HttpUrl.parse(' in t or 'toHttpUrlOrNull' in t: raise SystemExit('URL parser patch failed')
          root=Path('third_party/SmartTube-droid'); wanted={'auto_frame_rate_applying','proxy_test_error','proxy_test_start','proxy_test_status'}
          pat=re.compile(r'(<string\b[^>]*\bname=["\']('+'|'.join(wanted)+r')["\'][^>]*>)(.*?)(</string>)',re.S); tok=re.compile(r'%(?![0-9]+\$)([sdif])')
          for p in root.rglob('*.xml'):
              if '.git' in p.parts: continue
              x=p.read_text(errors='ignore')
              def repl(m):
                  i=[0]
                  def r(z): i[0]+=1; return f'%{i[0]}${z.group(1)}'
                  return m.group(1)+tok.sub(r,m.group(3))+m.group(4)
              p.write_text(pat.sub(repl,x))
          PY

      - name: Isolate SmartTube legacy player resources from Media3
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('third_party/SmartTube-droid')
          ui = root / 'exoplayer-amzn-2.10.6/library/ui'
          res = ui / 'src/main/res/layout'
          player = ui / 'src/main/java/com/google/android/exoplayer2/ui/PlayerView.java'
          required = [res / 'exo_player_view.xml', res / 'exo_simple_player_view.xml', player]
          for p in required:
              if not p.is_file():
                  raise SystemExit(f'Missing SmartTube player source: {p}')
          shutil.copy2(res / 'exo_player_view.xml', res / 'st_exo_player_view.xml')
          shutil.copy2(res / 'exo_simple_player_view.xml', res / 'st_exo_simple_player_view.xml')
          simple = res / 'st_exo_player_view.xml'
          t = simple.read_text()
          t2 = t.replace('@layout/exo_simple_player_view', '@layout/st_exo_simple_player_view')
          simple.write_text(t2)
          t = player.read_text()
          t2 = t.replace('R.layout.exo_player_view', 'R.layout.st_exo_player_view')
          if t2 == t:
              raise SystemExit('PlayerView layout reference not found')
          player.write_text(t2)
          print('Isolated SmartTube legacy PlayerView resources from Media3')
          PY

      - name: Configure build tools
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify SmartTube PlaybackActivity pitch overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/SmartTube-droid/smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java")
          lines = p.read_text().splitlines(True)
          for i, line in enumerate(lines):
              if "public float getPitch(" in line or "public void setPitch(" in line:
                  if i > 0 and lines[i - 1].strip() == "@Override":
                      lines[i - 1] = ""
          p.write_text("".join(lines))
          text = p.read_text()
          pos = text.find("public float getPitch(")
          print(text[max(0, pos - 120):pos + 180])
          if pos < 0:
              raise SystemExit("getPitch not found")
          if "@Override\\n    public float getPitch(" in text:
              raise SystemExit("stale getPitch @Override remains")
          print("Pitch override verification complete")
          for n, line in enumerate(text.splitlines(), 1):
              if 2425 <= n <= 2455:
                  print(f"{n}: {line}")
          PY

      - name: Finalize YouTube avatar getter compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/SmartTube-droid/MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java')
          if not p.is_file():
              raise SystemExit(f'Missing generated source: {p}')
          lines = p.read_text().splitlines(True)
          for i in range(1, len(lines)):
              if lines[i].strip().startswith('public String getChannelThumbnailUrl(') and lines[i-1].strip() == '@Override':
                  lines[i-1] = ''
          p.write_text(''.join(lines))
          text = p.read_text()
          pos = text.find('public String getChannelThumbnailUrl(')
          if pos < 0:
              raise SystemExit('NM7 avatar getter missing')
          before = text[max(0, pos-80):pos]
          if '@Override' in before:
              raise SystemExit('Stale @Override remains immediately before NM7 avatar getter')
          print('Finalized NM7 avatar getter without invalid @Override')
          PY

      - name: Build Mobile only (current NM7 IPTV Mobile)
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 -PmobileAbiSplits=true :app:testMobileDebugUnitTest -x :slidableactivity:testMobileDebugUnitTest --tests '*AppPreferencesTest' --tests '*ColdStartPlaybackTest' --tests '*DrmAndFpsTest' --tests '*M3uParserTest' --tests '*PlaylistSourceStoreTest' --tests '*RenderRecoveryScenarios' --tests '*SelectedRequestScenarios' --tests '*YouTubeBrowseGestureTest' --tests '*YouTubePlaybackErrorTest' --tests '*YouTubeRenderRecoveryTest' --tests '*YouTubeSurfaceLayoutTest'
          gradle --no-daemon --console=plain -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 -PbuildToolsVersion=36.0.0 -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 -ProbolectricVersion=4.6.1 -PmobileAbiSplits=true assembleMobileDebug
          set -euxo pipefail
          merged="$(find app/build/intermediates -type f -path '*mobileDebug*' -name AndroidManifest.xml | head -n1)"
          test -n "$merged"
          test -f "$merged"
          echo "Using merged manifest: $merged"
          ! grep -q 'TvLayoutTunerProvider\|TvStreamRecoveryProvider\|TvPlayerUiProvider\|VlcFallbackActivity' "$merged"
          ! grep -q 'LEANBACK_LAUNCHER' "$merged"
          ! unzip -l app/build/outputs/apk/mobile/debug/app-mobile-arm64-v8a-debug.apk | grep -q 'libvlc\.so'
          ! unzip -l app/build/outputs/apk/mobile/debug/app-mobile-armeabi-v7a-debug.apk | grep -q 'libvlc\.so'
          version="$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d'"' -f2)"
          out="app/build/outputs/apk/mobile/debug"; mkdir -p dist/mobile
          mapfile -t apks < <(find "$out" -maxdepth 1 -type f -name 'app-mobile-*-debug.apk' -printf '%f\n' | sort)
          test "${#apks[@]}" -eq 2
          arm64=""; armv7=""
          for name in "${apks[@]}"; do case "$name" in *arm64-v8a*) arm64="$out/$name";; *armeabi-v7a*) armv7="$out/$name";; *) echo "Unexpected ABI APK: $name"; exit 1;; esac; done
          test -f "$arm64" && test -f "$armv7"
          verify_abi() { local apk="$1"; local expected="$2"; "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"; if unzip -l "$apk" | grep -q 'lib/x86/\|lib/x86_64/\|libvlc\.so'; then exit 1; fi; case "$expected" in arm64-v8a) unzip -l "$apk" | grep -q 'lib/arm64-v8a/' ;; armeabi-v7a) unzip -l "$apk" | grep -q 'lib/armeabi-v7a/' ;; esac; }
          verify_abi "$arm64" "arm64-v8a"; verify_abi "$armv7" "armeabi-v7a"
          cp "$arm64" "dist/mobile/NM7-IPTV-Mobile-${version}-arm64-v8a.apk"; cp "$armv7" "dist/mobile/NM7-IPTV-Mobile-${version}-armeabi-v7a.apk"; sha256sum dist/mobile/*.apk | tee dist/mobile/SHA256SUMS.txt

      - name: Upload Mobile unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: Mobile-unit-test-results
          path: app/build/test-results/testMobileDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Upload Mobile APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0
        with:
          name: NM7-IPTV-Mobile-FINAL
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error

